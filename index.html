<!doctype html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PopChoice</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main>
            <div id="main-section">
                <div class="first-form-container">
                    <header>
                    <img class="first-form-logo" src="./assets/image/logo2.png" alt="popcorn">
                    </header>
                
                <form id="first-form">
                 <div class="first-form">
                    <input type="number" name="peoplenum" max="5" placeholder="How many people?">
                    <input type="text" name="time" placeholder="How much time do you have?">
                    <button type="submit">Start</button>
                  </div>
                </form>
                </div>

                <div class="second-form-container">
                     <header>
                    <img class="second-form-logo" src="./assets/image/logo.png" alt="popcorn">
                </header>
                <h1>1</h1>

                <form id="second-form">
                 <div class="second-form">
                    <div>
                        <label>What's your favorite movie and why?</label>
                        <textarea class="space" name="favorite_movie"></textarea>
                    </div>

                    <div>
                        <label>Are you in the mood for something new or a classic?</label>
                        <div class="space">
                        <span id="mood-btn" data-value ="New">New</span>
                        <span id="mood-btn" data-value ="Classic">Classic</span>
                        </div>
                        
                    </div>

                    <div>
                        <label>What are you in the mood for?</label>
                        <div class="space">
                            <span id="othermood-btn" data-value="Fun">Fun</span>
                            <span id="othermood-btn" data-value="Serious">Serious</span>
                            <span id="othermood-btn" data-value="Inspiring">Inspiring</span>
                            <span id="othermood-btn" data-value="Scary">Scary</span>
                        </div>
                        
                    </div>

                    <div>
                        <label>Which famous film person would you love to be stranded on an island with and why?</label> <br>
                        <textarea class="space" name="famous_person"></textarea>
                    </div>

                    <button type="submit">Next</button>
                  </div>

                </form>
                </div>
            </div>

                <!-- <div class="results" id="results">
                    <h1>The Martian (2015)</h1>
                    <img src="./assets/image/the-martian.jpg" alt="The Martian poster">
                    <p>When astronauts blast off from the planet Mars, they leave behind Mark Watney (Matt Damon), </p>
                    <div class="btn">
                       <button class="btn-next">Next movie</button>
                    </div>
                </div> -->
        </main>
        <script src="./index.js"></script>
    </body>
</html>
