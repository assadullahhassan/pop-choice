<!doctype html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PopChoice</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main>
            <div id="main-section">
                <div class="first-form-container">
                    <header>
                    <img class="first-form-logo" src="./assets/image/logo2.png" alt="popcorn">
                    </header>
                <form id="first-form">
                 <div class="first-form">
                    <input type="number" name="peoplenum" max="5" min="1" placeholder="How many people?" required>
                    <input type="text" name="time" placeholder="How much time do you have?" required>
                    <button type="submit">Start</button>
                  </div>
                </form>
                </div>
                <div class="second-form-container">
                     <header>
                    <img class="second-form-logo" src="./assets/image/logo.png" alt="popcorn">
                </header>
                <h1 id="person-count">1</h1>

                <form id="second-form">
                 <div class="second-form">
                    <div>
                        <label>What's your favorite movie and why?</label>
                        <textarea class="space" name="favorite_movie" required></textarea>
                    </div>

                    <div>
                        <label>Are you in the mood for something new or a classic?</label>
                        <div class="space">
                        <span id="mood-btn" data-value ="New">New</span>
                        <span id="mood-btn" data-value ="Classic">Classic</span>
                        </div>
                        
                    </div>

                    <div>
                        <label>What are you in the mood for?</label>
                        <div class="space">
                            <span id="othermood-btn" data-value="Fun">Fun</span>
                            <span id="othermood-btn" data-value="Serious">Serious</span>
                            <span id="othermood-btn" data-value="Inspiring">Inspiring</span>
                            <span id="othermood-btn" data-value="Scary">Scary</span>
                        </div>
                    </div>

                    <div>
                        <label>Which famous film person would you love to be stranded on an island with and why?</label> <br>
                        <textarea class="space" name="famous_person" required></textarea>
                    </div>

                    <button type="submit">Next</button>
                  </div>

                </form>
                </div>
                <div class="error" id="error">
                </div>
                <div id="loader" class="loader">
                    <svg fill="#51E08AFF" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="3"/><g><circle cx="4" cy="12" r="3"/><circle cx="20" cy="12" r="3"/><animateTransform attributeName="transform" type="rotate" calcMode="spline" dur="1s" keySplines=".36,.6,.31,1;.36,.6,.31,1" values="0 12 12;180 12 12;360 12 12" repeatCount="indefinite"/></g></svg>
                </div>
            </div>

            <div class="results" id="results">
                    
            </div>
             <div class="btn hidden" id="hidden-btn">
                <button class="btn-next" id="btn-fetchRecommendation">Next movie</button>
            </div>
        </main>
        <script src="./index.js" type="module"></script>
    </body>
</html>
